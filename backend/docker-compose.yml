version: '3.8'

services:
  # Database (MySQL)
  mysql_db:
    image: mysql:8.0
    container_name: qr_audio_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Infineti2006. 
      MYSQL_DATABASE: qr_audio_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Cache (Redis)
  redis_cache:
    image: redis:7-alpine
    container_name: qr_audio_redis
    restart: always
    ports:
      - "6379:6379"

  # Backend (Spring Boot)
  backend_app:
    build: .
    container_name: qr_audio_backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql_db
      - redis_cache
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql_db:3306/qr_audio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_REDIS_HOST=redis_cache
      - SPRING_REDIS_PORT=6379

volumes:
  mysql_data: