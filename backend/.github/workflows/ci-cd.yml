name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # CI: Build và Test
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: 1. Checkout mã nguồn
      uses: actions/checkout@v3

    - name: 2. Cài đặt Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: 3. Build ứng dụng bằng Maven
      run: mvn clean package -DskipTests

  # CD: Docker và Push
  deploy:
    needs: build 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: 1. Checkout mã nguồn
      uses: actions/checkout@v3

    - name: 2. Build Docker Image 
      run: docker build -t qraudio-backend:latest .

    - name: 3. Thông báo Triển khai thành công
      run: echo "Đã build xong Docker Image! Sẵn sàng push lên DockerHub hoặc Cloud Server."